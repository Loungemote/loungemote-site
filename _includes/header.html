{%- assign home = '/' | relative_url -%}
<header class="site-header" data-header>
  <div class="container site-header__inner">
    <a class="brand" href="{{ home }}" aria-label="Loungemote home">
      {% include logo.html id="header" size=30 %}
      <span>Loungemote</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
      <span class="visually-hidden">Menu</span>
      {% include icon.html name="menu" class="nav-toggle__open" %}
      {% include icon.html name="x" class="nav-toggle__close" %}
    </button>
    <nav class="site-nav" id="site-nav" aria-label="Main" data-nav>
      <ul>
        <li><a href="{{ home }}#features">Features</a></li>
        <li><a href="{{ home }}#how-it-works">How it works</a></li>
        <li><a href="{{ home }}#devices">Devices</a></li>
        <li><a href="{{ home }}#privacy">Privacy</a></li>
        <li><a href="{{ home }}#faq">FAQ</a></li>
        <li><a href="{{ '/support/' | relative_url }}"{% if page.url == '/support/' %} aria-current="page"{% endif %}>Support</a></li>
      </ul>
      <a class="button button--small button--ember" href="{{ home }}#download">Get the app</a>
    </nav>
  </div>
</header>
