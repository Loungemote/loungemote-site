  lead: Loungemote is a TV remote app for iPhone and iPad. It controls Samsung, LG, Roku, Fire TV, Android TV, Google TV, Vizio, Sony and other smart TVs over your Wi&#8209;Fi. No infrared blaster, no account, no ads.
  how_link: See how it works
