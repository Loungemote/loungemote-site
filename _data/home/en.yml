features:
  title: Everything your remote does, and more.
  lead: The full button remote, plus a touchpad, your phone's keyboard, apps in one tap and casting.
  footnote: Some features depend on the TV model and its software.
  items:
    - { icon: dpad, title: A full remote, text: "Directional pad, OK, Back, Home, volume, channels, playback and power. Finds the TVs on your Wi-Fi and reconnects when you open the app." }
    - { icon: hand, title: Swipe touchpad, text: "Glide through menus with your thumb and tap for OK. On LG TVs it moves the pointer." }
    - { icon: keyboard, title: Phone keyboard, text: "Type searches and passwords with your iPhone keyboard, or dictate them." }
    - { icon: grid, title: Apps in one tap, text: "Every app on your TV in one grid. Open one straight from your phone." }
    - { icon: cast, title: Cast to the big screen, text: "Photos, slideshows, videos, files and links to your TV, Chromecast or Roku." }
    - { icon: bolt, title: Power on over Wi-Fi, text: "Wake a TV from standby with your phone, on TVs that support it." }
how:
  title: Ready in seconds.
  lead: No sign-in and no extra hardware. If your TV is on your Wi-Fi, you're most of the way there.
  steps:
    - { screen: choose-tv, title: Open the app on your Wi-Fi, text: Loungemote scans your network and lists the TVs and streaming devices it finds., alt: "Choose your TV: the TVs found on this Wi-Fi network." }
    - { screen: pair, title: Approve it once on the TV, text: "Select Allow on the TV, or type the code it shows. You only do this the first time.", alt: "Pair TV: the TV asks whether to trust this iPhone." }
    - { screen: remote, title: Start pressing, text: "Your phone is now the remote. Next time, the app reconnects as soon as you open it.", alt: The remote, connected to the Living Room TV. }
devices:
  title: Ten TV platforms. One app.
  lead: Loungemote speaks each TV's own network protocol, so it needs no infrared blaster and no hub. Your iPhone and your TV only have to be on the same Wi-Fi network.
  footnote: Roku TV and Google TV models from other brands, such as TCL, work too. Casting isn't available on Fire TV. Apple TV and infrared-only TVs are not supported. Select a platform for its setup guide.
privacy:
  title: Private <em>by design</em>.
  lead: A remote has no reason to know who you are. Loungemote has no accounts and no servers of its own, and remote commands go straight from your phone to your TV.
  link: Read the privacy policy
  items:
    - { icon: useroff, title: No account, text: "No sign-up, no email address, nothing to log in to." }
    - { icon: eyeoff, title: No ads, text: No advertising code and no advertising identifier. }
    - { icon: wifi, title: Stays on your network, text: "Commands travel over your Wi-Fi, directly to the TV you selected." }
    - { icon: lock, title: Keys stay on your iPhone, text: Pairing data is kept in the iOS Keychain and never sent to us. }
  note: The app sends anonymous usage statistics and crash reports to Google (Firebase) so we can see which TVs connect and fix problems. They never include TV names, network addresses, what you type or what you cast, and you can turn them off in Settings > Privacy > Share Usage Data. When you cast to a Google Cast device, Google's Cast SDK also sends Google diagnostic data.
faq:
  title: Questions, answered.
  more: Something else? Email us at
  items:
    - q: Is Loungemote free?
      a: Downloading, setup and the Demo TV are free, and there are no ads. Controlling your TV needs Loungemote Pro, which includes the full remote, the touchpad, the phone keyboard, the app launcher, Siri and Shortcuts, and casting of photos, videos, files and links. Pro is a weekly subscription with a 3-day free trial for new subscribers, a yearly subscription, or a one-time lifetime purchase.
    - q: Which TVs work with Loungemote?
      a: Samsung smart TVs with Tizen (2016 and later), LG webOS TVs, Sony Bravia, Xiaomi TVs with PatchWall, Hisense TVs with VIDAA, Philips TVs with Titan OS or Saphi, Android TV and Google TV devices, Roku, Amazon Fire TV and Vizio SmartCast. Roku TV and Google TV models from other brands, such as TCL, work too. Apple TV and infrared-only TVs are not supported.
    - q: Do I need an IR blaster or a universal remote?
      a: No. Loungemote controls smart TVs over your home Wi-Fi. It does not use infrared, so it cannot control older TVs that only accept an infrared remote.
    - q: The app can't find my TV. What should I do?
      a: Check that the TV is on and on the same Wi-Fi as your iPhone (guest networks often keep devices apart), and turn on Loungemote in iOS Settings > Privacy & Security > Local Network. If it still doesn't appear, add the TV by its IP address in the app.
    - q: Can I turn my TV on with my phone?
      a: On many TVs, yes. First turn on the TV's network wake setting, such as Power On with Mobile on Samsung, Turn on via Wi-Fi on LG or Fast TV start on Roku TV.
    - q: What data does Loungemote collect?
      a: No personal data. There are no accounts and no ads, and remote commands go straight from your iPhone to your TV. To see which TVs connect and to fix crashes, the app sends anonymous usage statistics and crash reports to Google Analytics for Firebase and Firebase Crashlytics. They never include TV names, network addresses, text you type or what you cast, and you can turn them off in Settings > Privacy > Share Usage Data.
    - q: Does it work on iPad, and in my language?
      a: Yes. Loungemote has a split-view layout for iPad and needs iOS 17 or iPadOS 17 or later. The app is available in English, Chinese (Simplified and Traditional), Japanese, Korean, German, French, Spanish, Portuguese (Brazil), Russian and Indonesian.
