devices:
  title: Ten TV platforms. One app.
  lead: Loungemote uses each TV’s own network protocol, so it needs no infrared blaster or hub. Your phone or tablet and your TV must be on the same Wi-Fi network.
  footnote: Roku TV and Google TV models from other brands, such as TCL, work too. Casting isn't available on Fire TV. Apple TV and infrared-only TVs are not supported. Select a platform for its setup guide.
privacy:
  title: Private <em>by design</em>.
  lead: A remote has no reason to know who you are. Loungemote has no accounts and no servers of its own, and remote commands go straight from your phone to your TV.
  link: Read the privacy policy
  items:
    - { icon: "useroff", title: "No account", text: "No sign-up, no email address, nothing to log in to." }
    - { icon: "eyeoff", title: "No ads", text: "No advertising code and no advertising identifier." }
    - { icon: "wifi", title: "Stays on your network", text: "Commands travel over your Wi-Fi, directly to the TV you selected." }
    - { icon: "lock", title: "Keys stay on your device", text: "Pairing records use Android Keystore protection or the iOS Keychain. They are not sent to us." }
  note: On Android, Share Usage Data is off by default and the current release has no Firebase configuration. On iOS, Firebase usage statistics and crash reports are on by default; turn them off in Settings > Privacy > Share Usage Data. These reports exclude TV names, network addresses, typed text and cast content. Google Cast has separate diagnostic collection that this switch does not control.
faq:
  title: Questions, answered.
  more: Something else? Email us at
  items:
    - q: Is Loungemote free?
      a: Download, setup, your first key press to check the connection and Demo TV are free, with no ads. TV control, touchpad, keyboard, app launch and media casting need Loungemote Pro. Choose a weekly subscription with a 3-day trial for eligible new subscribers, a yearly subscription with no trial, or a one-time Lifetime purchase. Prices and offers appear before payment. Android purchases use Google Play; iOS purchases use the App Store. Siri and Shortcuts are for iOS only.
    - q: Which TVs work with Loungemote?
      a: Samsung smart TVs with Tizen (2016 and later), LG webOS TVs, Sony Bravia, Xiaomi TVs with PatchWall, Hisense TVs with VIDAA, Philips TVs with Titan OS or Saphi, Android TV and Google TV devices, Roku, Amazon Fire TV and Vizio SmartCast. Roku TV and Google TV models from other brands, such as TCL, work too. Apple TV and infrared-only TVs are not supported.
    - q: Do I need an IR blaster or a universal remote?
      a: No. Loungemote controls smart TVs over your home Wi-Fi. It does not use infrared, so it cannot control older TVs that only accept an infrared remote.
    - q: The app can't find my TV. What should I do?
      a: Keep the TV on and connect it to the same Wi-Fi as your phone; guest networks can block discovery. On Android, allow Nearby devices when requested. On iOS, enable Loungemote in Settings > Privacy & Security > Local Network. You can also add a TV by its IP address.
    - q: Can I turn my TV on with my phone?
      a: On many TVs, yes. First turn on the TV's network wake setting, such as Power On with Mobile on Samsung, Turn on via Wi-Fi on LG or Fast TV start on Roku TV.
    - q: What data does Loungemote collect?
      a: No account or ads. Remote commands go directly from your phone to the TV. Pairing records stay on your device. Android has no Firebase configuration in the current release. iOS has optional Firebase usage and crash reports, on by default. Google Cast collects separate SDK diagnostics. See the privacy policy for details.
    - q: Is Loungemote available for Android and iPhone?
      a: Android is available on Google Play for phones and tablets running Android 8.0 or later. iPhone and iPad are coming soon to the App Store and require iOS 17 or iPadOS 17 or later. No iOS release date is announced. The app supports English, Chinese (Simplified and Traditional), Japanese, Korean, German, French, Spanish, Portuguese (Brazil), Russian and Indonesian.
    - q: Does casting mirror my phone screen?
      a: "Media casting sends selected photos, videos, files or supported links to a compatible receiver. Screen mirroring uses your phone’s system feature: Android system screen casting or AirPlay on iOS. Availability depends on your phone and TV; Loungemote does not provide its own screen-mirroring service."
    - q: How do I restore or cancel Pro?
      a: Use Restore Purchases in the app with the store account used for payment. Manage Android subscriptions in Google Play and iOS subscriptions in Apple Settings. Deleting the app does not cancel a subscription. Purchases do not transfer between Google Play and the App Store.
