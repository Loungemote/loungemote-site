privacy:
  title: Privat <em>von Anfang an</em>.
  lead: Eine Fernbedienung muss nicht wissen, wer du bist. Loungemote hat keine Konten und keine eigenen Server, und Befehle gehen direkt vom Handy zum Fernseher.
  link: Datenschutzerklärung lesen (Englisch)
  items:
    - { icon: useroff, title: Kein Konto, text: "Keine Registrierung, keine E-Mail-Adresse, keine Anmeldung." }
    - { icon: eyeoff, title: Keine Werbung, text: Kein Werbecode und keine Werbe-ID. }
    - { icon: wifi, title: Bleibt in deinem Netzwerk, text: Befehle gehen über dein WLAN direkt an den gewählten Fernseher. }
    - { icon: lock, title: Schlüssel bleiben auf dem iPhone, text: Kopplungsdaten liegen im iOS-Schlüsselbund und werden nie an uns gesendet. }
  note: "Die App sendet anonyme Nutzungsstatistiken und Absturzberichte an Google (Firebase), damit wir sehen, welche Fernseher sich verbinden, und Fehler beheben können. Sie enthalten nie Fernsehernamen, Netzwerkadressen, getippten Text oder gestreamte Inhalte. Du kannst das unter Einstellungen > Datenschutz > Nutzungsdaten teilen ausschalten. Beim Streamen auf ein Google-Cast-Gerät sendet auch Googles Cast SDK Diagnosedaten an Google."
faq:
  title: Häufige Fragen
  more: Noch Fragen? Schreib uns an
  items:
    - q: Ist Loungemote kostenlos?
      a: "Download, Einrichtung und Demo TV sind kostenlos und ohne Werbung. Zum Steuern des Fernsehers brauchst du Loungemote Pro: die komplette Fernbedienung, Touchpad, Handytastatur, App-Start, Siri und Kurzbefehle sowie das Streamen von Fotos, Videos, Dateien und Links. Pro gibt es als Wochenabo (für Neukunden 3 Tage gratis), als Jahresabo oder als einmaligen Kauf."
    - q: Welche Fernseher werden unterstützt?
      a: Samsung Smart TVs mit Tizen (ab 2016), LG mit webOS, Sony Bravia, Amazon Fire TV, Android TV und Google TV, Philips mit Titan OS oder Saphi, Hisense mit VIDAA, Xiaomi mit PatchWall, Roku und Vizio SmartCast. Roku-TV- und Google-TV-Modelle anderer Marken wie TCL funktionieren ebenfalls. Apple TV und reine Infrarot-Fernseher werden nicht unterstützt.
    - q: Brauche ich einen Infrarot-Adapter oder eine Universalfernbedienung?
      a: Nein. Loungemote steuert Smart TVs über dein WLAN. Infrarot wird nicht genutzt, daher lassen sich ältere Fernseher, die nur auf Infrarot reagieren, nicht steuern.
    - q: Die App findet meinen Fernseher nicht. Was tun?
      a: Prüfe, ob der Fernseher eingeschaltet und im selben WLAN wie das iPhone ist (Gastnetzwerke blockieren oft die Verbindung). Schalte Loungemote unter iOS-Einstellungen > Datenschutz & Sicherheit > Lokales Netzwerk ein. Findet die App den Fernseher weiterhin nicht, füge ihn über seine IP-Adresse hinzu.
    - q: Kann ich den Fernseher mit dem Handy einschalten?
      a: Bei vielen Fernsehern ja. Schalte vorher am Fernseher das Einschalten über das Netzwerk ein, zum Beispiel Power On with Mobile bei Samsung, Turn on via Wi-Fi bei LG oder Fast TV start bei Roku TV. Die Namen können je nach Modell und Sprache abweichen.
    - q: Welche Daten erhebt Loungemote?
      a: Keine personenbezogenen Daten. Es gibt keine Konten und keine Werbung, und Befehle gehen direkt vom iPhone zum Fernseher. Um zu sehen, welche Fernseher sich verbinden, und Abstürze zu beheben, sendet die App anonyme Nutzungsstatistiken und Absturzberichte an Google Analytics for Firebase und Firebase Crashlytics. Sie enthalten nie Fernsehernamen, Netzwerkadressen, getippten Text oder gestreamte Inhalte. Du kannst das unter Einstellungen > Datenschutz > Nutzungsdaten teilen ausschalten.
    - q: Gibt es die App für iPad und auf Deutsch?
      a: Ja. Auf dem iPad gibt es eine geteilte Ansicht. Loungemote braucht iOS 17 oder iPadOS 17 oder neuer und ist auf Deutsch, Englisch, Chinesisch (vereinfacht und traditionell), Japanisch, Koreanisch, Französisch, Spanisch, Portugiesisch (Brasilien), Russisch und Indonesisch verfügbar.
