privacy:
  title: Privat <em>von Anfang an</em>.
  lead: Eine Fernbedienung muss nicht wissen, wer du bist. Loungemote hat keine Konten und keine eigenen Server, und Befehle gehen direkt vom Handy zum Fernseher.
  link: Datenschutzerklärung lesen (Englisch)
  items:
    - { icon: "useroff", title: "Kein Konto", text: "Keine Registrierung, keine E-Mail-Adresse, keine Anmeldung." }
    - { icon: "eyeoff", title: "Keine Werbung", text: "Kein Werbecode und keine Werbe-ID." }
    - { icon: "wifi", title: "Bleibt in deinem Netzwerk", text: "Befehle gehen über dein WLAN direkt an den gewählten Fernseher." }
    - { icon: "lock", title: "Schlüssel bleiben auf dem Gerät", text: "Kopplungsdaten werden mit Android Keystore oder im iOS-Schlüsselbund geschützt und nicht an uns gesendet." }
  note: Unter Android ist Nutzungsdaten teilen standardmäßig aus; die aktuelle Version hat keine Firebase-Konfiguration. Unter iOS sind Firebase-Nutzungsstatistiken und Absturzberichte standardmäßig an. Du kannst sie unter Einstellungen > Datenschutz > Nutzungsdaten teilen ausschalten. Sie enthalten keine TV-Namen, Netzwerkadressen, eingegebenen Texte oder gestreamten Inhalte. Google Cast erhebt separate Diagnosedaten, die dieser Schalter nicht steuert.
faq:
  title: Häufige Fragen
  more: Noch Fragen? Schreib uns an
  items:
    - q: Ist Loungemote kostenlos?
      a: Download, Einrichtung, der erste Tastendruck zum Prüfen der Verbindung und Demo TV sind kostenlos und ohne Werbung. TV-Steuerung, Touchpad, Tastatur, App-Start und Medien-Streaming benötigen Loungemote Pro. Es gibt ein Wochenabo mit 3 Tagen Probezeit für berechtigte Neukunden, ein Jahresabo ohne Probezeit oder einen einmaligen Kauf. Preise und Angebote werden vor der Zahlung angezeigt. Android nutzt Google Play, iOS den App Store. Siri und Kurzbefehle sind nur für iOS.
    - q: Welche Fernseher werden unterstützt?
      a: Samsung Smart TVs mit Tizen (ab 2016), LG mit webOS, Sony Bravia, Amazon Fire TV, Android TV und Google TV, Philips mit Titan OS oder Saphi, Hisense mit VIDAA, Xiaomi mit PatchWall, Roku und Vizio SmartCast. Roku-TV- und Google-TV-Modelle anderer Marken wie TCL funktionieren ebenfalls. Apple TV und reine Infrarot-Fernseher werden nicht unterstützt.
    - q: Brauche ich einen Infrarot-Adapter oder eine Universalfernbedienung?
      a: Nein. Loungemote steuert Smart TVs über dein WLAN. Infrarot wird nicht genutzt, daher lassen sich ältere Fernseher, die nur auf Infrarot reagieren, nicht steuern.
    - q: Die App findet meinen Fernseher nicht. Was tun?
      a: Der Fernseher muss eingeschaltet und im selben WLAN wie dein Handy sein; Gastnetzwerke können Geräte trennen. Erlaube unter Android Geräte in der Nähe, wenn die App danach fragt. Aktiviere unter iOS Einstellungen > Datenschutz & Sicherheit > Lokales Netzwerk für Loungemote. Du kannst den Fernseher auch per IP-Adresse hinzufügen.
    - q: Kann ich den Fernseher mit dem Handy einschalten?
      a: Bei vielen Fernsehern ja. Schalte vorher am Fernseher das Einschalten über das Netzwerk ein, zum Beispiel Power On with Mobile bei Samsung, Turn on via Wi-Fi bei LG oder Fast TV start bei Roku TV. Die Namen können je nach Modell und Sprache abweichen.
    - q: Welche Daten erhebt Loungemote?
      a: Kein Konto und keine Werbung. Befehle gehen direkt vom Handy zum TV, Kopplungsdaten bleiben auf dem Gerät. Die aktuelle Android-Version hat keine Firebase-Konfiguration. iOS hat optionale Firebase-Nutzungsstatistiken und Absturzberichte, standardmäßig an. Google Cast erhebt separate SDK-Diagnosedaten. Details stehen in der Datenschutzerklärung.
    - q: Ist Loungemote für Android und iPhone erhältlich?
      a: Android ist auf Google Play für Handys und Tablets mit Android 8.0 oder neuer erhältlich. iPhone und iPad folgen im App Store und benötigen iOS 17 oder iPadOS 17 oder neuer. Ein iOS-Startdatum ist noch nicht bekannt. Die App unterstützt Deutsch, Englisch, Chinesisch (vereinfacht und traditionell), Japanisch, Koreanisch, Französisch, Spanisch, Portugiesisch (Brasilien), Russisch und Indonesisch.
    - q: Spiegelt Streaming den Handybildschirm?
      a: "Medien-Streaming sendet ausgewählte Fotos, Videos, Dateien oder unterstützte Links an einen kompatiblen Empfänger. Bildschirmspiegelung nutzt die Systemfunktion: Android-Bildschirmübertragung oder AirPlay unter iOS. Die Verfügbarkeit hängt von Handy und Fernseher ab. Loungemote bietet keinen eigenen Dienst zur Bildschirmspiegelung."
    - q: Wie stelle ich Pro wieder her oder kündige es?
      a: Nutze Käufe wiederherstellen in der App mit dem Konto, mit dem du bezahlt hast. Android-Abos verwaltest du in Google Play, iOS-Abos in den Apple-Einstellungen. Das Löschen der App kündigt kein Abo. Käufe werden nicht zwischen Google Play und dem App Store übertragen.
