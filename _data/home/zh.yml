privacy:
  title: 从设计上保护隐私。
  lead: 遥控器没有理由知道你是谁。Loungemote 没有账号，也没有自己的服务器，遥控指令直接从手机发到电视。
  link: 阅读隐私政策（英文）
  items:
    - { icon: useroff, title: 无需账号, text: 不用注册，不用邮箱，没有需要登录的东西。 }
    - { icon: eyeoff, title: 没有广告, text: 没有广告代码，不使用广告标识符。 }
    - { icon: wifi, title: 留在你的网络里, text: 指令通过 Wi-Fi 直接发送到你选择的电视。 }
    - { icon: lock, title: 密钥留在 iPhone 上, text: 配对数据保存在 iOS 钥匙串中，不会发送给我们。 }
  note: App 会向 Google（Firebase）发送匿名使用统计和崩溃报告，帮助我们了解哪些电视连接顺利并修复问题。它从不包含电视名称、网络地址、你输入的文字或投放的内容，可在“设置 > 隐私 > 共享使用数据”中关闭。投屏到 Google Cast 设备时，Google 的 Cast SDK 也会向 Google 发送诊断数据。
faq:
  title: 常见问题
  more: 还有其他问题？请发邮件至
  items:
    - q: Loungemote 免费吗？
      a: 下载、设置和演示电视免费，且没有广告。控制电视需要 Loungemote Pro，包括完整遥控、触控板、手机键盘、应用启动、Siri 与快捷指令，以及照片、视频、文件和链接的投屏。Pro 提供周订阅（新订阅用户免费试用 3 天）、年订阅或一次性买断。
    - q: 支持哪些电视？
      a: 三星 Tizen 智能电视（2016 年及以后）、LG webOS 电视、索尼 Bravia、小米 PatchWall 电视、海信 VIDAA 电视、飞利浦 Titan OS 和 Saphi 电视、Android TV 和 Google TV 设备、Roku、Amazon Fire TV 和 Vizio SmartCast。TCL 等品牌的 Roku TV 和 Google TV 机型同样适用。不支持 Apple TV 和仅支持红外控制的电视。
    - q: 需要红外发射器或万能遥控器吗？
      a: 不需要。Loungemote 通过家里的 Wi-Fi 控制智能电视，不使用红外，所以无法控制只能用红外遥控的老电视。
    - q: 找不到电视怎么办？
      a: 确认电视已开机，并和 iPhone 连接同一个 Wi-Fi（访客网络常会阻止设备互连）；在 iOS“设置 > 隐私与安全性 > 本地网络”中打开 Loungemote。仍找不到时，可在 App 中按 IP 地址添加电视。
    - q: 能用手机开机吗？
      a: 很多电视可以。先在电视上打开网络唤醒设置，例如三星的 Power On with Mobile、LG 的 Turn on via Wi-Fi、Roku TV 的 Fast TV start。
    - q: Loungemote 收集哪些数据？
      a: 不收集个人数据。没有账号和广告，遥控指令直接从 iPhone 发到电视。为了解哪些电视能顺利连接并修复崩溃，App 会向 Google Analytics for Firebase 和 Firebase Crashlytics 发送匿名使用统计和崩溃报告，不包含电视名称、网络地址、输入的文字或投放的内容，可在“设置 > 隐私 > 共享使用数据”中关闭。
    - q: 支持 iPad 和中文吗？
      a: 支持。Loungemote 为 iPad 提供分栏布局，需要 iOS 17 或 iPadOS 17 及以上版本。App 支持简体中文、繁体中文、英语、日语、韩语、德语、法语、西班牙语、葡萄牙语（巴西）、俄语和印尼语。
