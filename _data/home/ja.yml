privacy:
  title: プライバシーを最初から大切に。
  lead: リモコンがあなたのことを知る必要はありません。Loungemoteにはアカウントも専用サーバーもなく、操作はスマホからテレビへ直接届きます。
  link: プライバシーポリシー（英語）
  items:
    - { icon: useroff, title: アカウント不要, text: 登録もメールアドレスもログインもありません。 }
    - { icon: eyeoff, title: 広告なし, text: 広告コードも広告識別子も使いません。 }
    - { icon: wifi, title: ご家庭のネットワーク内で, text: 操作はWi-Fiで選んだテレビへ直接送られます。 }
    - { icon: lock, title: 鍵はiPhoneに, text: ペアリング情報はiOSのキーチェーンに保存され、私たちには送られません。 }
  note: 接続しやすいテレビの把握と不具合の修正のため、匿名の利用統計とクラッシュレポートをGoogle（Firebase）に送信します。テレビ名、ネットワークアドレス、入力した文字、キャストした内容は一切含まれず、「設定 > プライバシー > 使用状況データを共有」でオフにできます。Google Castデバイスへキャストすると、GoogleのCast SDKも診断データをGoogleに送信します。
faq:
  title: よくある質問
  more: ほかにご質問があれば、こちらへメールでどうぞ：
  items:
    - q: Loungemoteは無料ですか？
      a: ダウンロード、設定、デモテレビは無料で、広告もありません。テレビの操作にはLoungemote Proが必要です。Proではボタン操作のリモコン、タッチパッド、スマホのキーボード、アプリ起動、Siriとショートカット、写真・動画・ファイル・リンクのキャストが使えます。Proは週額（新規の方は3日間無料）・年額サブスクリプションまたは買い切りです。
    - q: どのテレビに対応していますか？
      a: ソニー ブラビア、LG（webOS）、Amazon Fire TV、Android TVとGoogle TVの端末、ハイセンス（VIDAA）、シャオミ（PatchWall）、Samsung（Tizen、2016年以降）、フィリップス（Titan OS、Saphi）、Roku、Vizio SmartCast。TCLなどのRoku TVやGoogle TV搭載モデルにも対応します。Apple TVと赤外線操作のみのテレビには対応していません。
    - q: 赤外線アダプタや学習リモコンは必要ですか？
      a: 不要です。Loungemoteはご家庭のWi-Fiでスマートテレビを操作します。赤外線は使わないため、赤外線リモコンでしか操作できない古いテレビには使えません。
    - q: テレビが見つからないときは？
      a: テレビの電源が入っていて、iPhoneと同じWi-Fiにつながっているか確認してください（ゲストネットワークでは機器同士がつながらないことがあります）。iOSの「設定 > プライバシーとセキュリティ > ローカルネットワーク」でLoungemoteをオンにします。それでも見つからない場合は、アプリでIPアドレスを入力して追加できます。
    - q: スマホでテレビの電源を入れられますか？
      a: 多くのテレビで可能です。先にテレビでネットワーク経由の起動設定をオンにしてください。例：SamsungのPower On with Mobile、LGのTurn on via Wi-Fi、Roku TVのFast TV start。
    - q: どんなデータを収集しますか？
      a: 個人データは収集しません。アカウントも広告もなく、操作はiPhoneからテレビへ直接届きます。接続しやすいテレビの把握とクラッシュの修正のため、匿名の利用統計とクラッシュレポートをGoogle Analytics for FirebaseとFirebase Crashlyticsに送信します。テレビ名、ネットワークアドレス、入力した文字、キャストした内容は含まれず、「設定 > プライバシー > 使用状況データを共有」でオフにできます。
    - q: iPadと日本語に対応していますか？
      a: はい。iPad向けの分割レイアウトがあり、iOS 17またはiPadOS 17以降が必要です。アプリは日本語、英語、中国語（簡体字・繁体字）、韓国語、ドイツ語、フランス語、スペイン語、ポルトガル語（ブラジル）、ロシア語、インドネシア語に対応しています。
