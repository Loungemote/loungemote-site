privacy:
  title: <em>プライバシー</em>を最初から大切に。
  lead: リモコンがあなたのことを知る必要はありません。Loungemoteにはアカウントも専用サーバーもなく、操作はスマホからテレビへ直接届きます。
  link: プライバシーポリシー（英語）
  items:
    - { icon: "useroff", title: "アカウント不要", text: "登録もメールアドレスもログインもありません。" }
    - { icon: "eyeoff", title: "広告なし", text: "広告コードも広告識別子も使いません。" }
    - { icon: "wifi", title: "ご家庭のネットワーク内で", text: "操作はWi-Fiで選んだテレビへ直接送られます。" }
    - { icon: "lock", title: "鍵は端末内に", text: "ペアリング情報はAndroid KeystoreまたはiOSキーチェーンで保護され、私たちには送信されません。" }
  note: Androidでは「使用状況データを共有」は初期設定でオフで、現在の公開版にFirebaseの設定はありません。iOSではFirebaseの利用統計とクラッシュレポートが初期設定でオンです。「設定 > プライバシー > 使用状況データを共有」でオフにできます。テレビ名、ネットワークアドレス、入力した文字、キャストした内容は含まれません。Google Castの独立した診断データ収集は、このスイッチでは制御できません。
faq:
  title: よくある質問
  more: ほかにご質問があれば、こちらへメールでどうぞ：
  items:
    - q: Loungemoteは無料ですか？
      a: ダウンロード、設定、接続確認のための最初のキー操作、デモテレビは無料で、広告もありません。テレビ操作、タッチパッド、キーボード、アプリ起動、メディアキャストにはLoungemote Proが必要です。対象の新規ユーザーは週額プランを3日間無料で試せます。無料期間のない年額プランと買い切りもあり、価格や特典は支払い前に表示されます。AndroidはGoogle Play、iOSはApp Storeで購入します。SiriとショートカットはiOS専用です。
    - q: どのテレビに対応していますか？
      a: ソニー ブラビア、LG（webOS）、Amazon Fire TV、Android TVとGoogle TVの端末、ハイセンス（VIDAA）、シャオミ（PatchWall）、Samsung（Tizen、2016年以降）、フィリップス（Titan OS、Saphi）、Roku、Vizio SmartCast。TCLなどのRoku TVやGoogle TV搭載モデルにも対応します。Apple TVと赤外線操作のみのテレビには対応していません。
    - q: 赤外線アダプタや学習リモコンは必要ですか？
      a: 不要です。Loungemoteはご家庭のWi-Fiでスマートテレビを操作します。赤外線は使わないため、赤外線リモコンでしか操作できない古いテレビには使えません。
    - q: テレビが見つからないときは？
      a: テレビの電源を入れ、スマホと同じWi-Fiに接続してください。ゲストネットワークは機器間の接続を妨げることがあります。Androidでは求められたときに付近のデバイス権限を許可します。iOSでは「設定 > プライバシーとセキュリティ > ローカルネットワーク」でLoungemoteをオンにします。IPアドレスでテレビを追加することもできます。
    - q: スマホでテレビの電源を入れられますか？
      a: 多くのテレビで可能です。先にテレビでネットワーク経由の起動設定をオンにしてください。例：SamsungのPower On with Mobile、LGのTurn on via Wi-Fi、Roku TVのFast TV start。
    - q: どんなデータを収集しますか？
      a: アカウントも広告もありません。操作はスマホからテレビへ直接届き、ペアリング情報は端末内に保存されます。現在のAndroid版にFirebaseの設定はありません。iOSでは任意のFirebase利用統計とクラッシュレポートが初期設定でオンです。Google Castは別途SDK診断データを収集します。詳しくはプライバシーポリシーをご覧ください。
    - q: Android版とiPhone版は公開されていますか？
      a: Android版はGoogle Playで公開中で、Android 8.0以降のスマホとタブレットに対応します。iPhone・iPad版はApp Storeで近日公開、iOS 17またはiPadOS 17以降が必要です。iOSの公開日は未定です。日本語、英語、中国語（簡体字・繁体字）、韓国語、ドイツ語、フランス語、スペイン語、ポルトガル語（ブラジル）、ロシア語、インドネシア語に対応します。
    - q: キャストは画面ミラーリングですか？
      a: メディアキャストは選択した写真、動画、ファイルや対応リンクを互換性のある受信機に送ります。画面ミラーリングにはAndroidのシステム画面キャストやiOSのAirPlayを使います。利用できるかはスマホとテレビによって異なり、Loungemote独自の画面ミラーリング機能はありません。
    - q: Proの復元や解約はどうしますか？
      a: 支払いに使ったストアアカウントで、アプリの「購入を復元」を使ってください。Androidの定期購入はGoogle Play、iOSはAppleの設定で管理します。アプリを削除しても定期購入は解約されません。Google PlayとApp Storeの間で購入は引き継げません。
